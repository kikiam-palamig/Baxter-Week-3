<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cosmic</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="page-container">
        <div class="card">
            <header class="card-header">
                <h1 class="brand-title">🌌 Cosmic</h1>
                <p class="subtitle">Welcome back! Please enter your details.</p>
            </header>

            <div id="formAlert" class="form-alert" role="alert" hidden></div>

            <form action="#" method="POST" class="auth-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username or email" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
                </div>

                <div class="form-actions">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember" id="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Login</button>
            </form>

            <p class="demo-hint">Demo account: <strong>admin</strong> / <strong>12345</strong></p>

            <footer class="card-footer">
                <p>Don't have an account? <a href="register.html">Register</a></p>
            </footer>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
