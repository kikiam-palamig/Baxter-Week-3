<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Cosmic</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="page-container">
        <div class="card">
            <header class="card-header">
                <h1 class="brand-title">🌌 Cosmic</h1>
                <p class="subtitle">Create an account to join us.</p>
            </header>

            <div id="formAlert" class="form-alert" role="alert" hidden></div>

            <form action="#" method="POST" class="auth-form" id="registerForm" novalidate>
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" placeholder="Create a password" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm your password" autocomplete="new-password">
                </div>

                <button type="submit" class="submit-btn">Register</button>
            </form>

            <footer class="card-footer">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </footer>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
